# Optional: brings up PostGIS if you have Docker. Otherwise use `brew install postgis`.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
